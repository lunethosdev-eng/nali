<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c0c0e">
  <meta name="description" content="Nali — tu música, tu espacio.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nali">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Nali</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      width: 100%;
      background: #0c0c0e;
    }
    body { min-height: 100vh; }
    #nali-load-error {
      display: none;
      box-sizing: border-box;
      min-height: 100vh;
      padding: 28px;
      color: #fff;
      background: #0c0c0e;
      font: 14px/1.5 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="nali-load-error" role="alert">
    <h2>No se pudo cargar Nali</h2>
    <p>Comprueba la conexión y vuelve a cargar la página. Si el problema continúa, revisa que GitHub Pages esté publicando la carpeta build/web.</p>
  </div>
  <script>
    window.addEventListener('error', function (event) {
      if (event.target && event.target.tagName === 'SCRIPT') {
        document.getElementById('nali-load-error').style.display = 'block';
      }
    }, true);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
